name: kenya_food_prices
version: "1.0.0"
config-version: 2

# Profile to use (matches profiles.yml)
profile: kenya_food_prices

# Directory structure
model-paths:      ["models"]
test-paths:       ["tests"]
seed-paths:       ["seeds"]
macro-paths:      ["macros"]
snapshot-paths:   ["snapshots"]

target-path:  "target"
clean-targets: ["target", "dbt_packages"]

# ── Model configs ───────────────────────────────────────────
models:
  kenya_food_prices:

    staging:
      +materialized: view
      +schema:       analytics

    marts:
      +materialized: table
      +schema:       marts

# ── Variable defaults ────────────────────────────────────────
vars:
  start_date: "2006-01-01"
  end_date:   "2026-12-31"
