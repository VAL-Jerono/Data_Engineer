kenya_food_prices:
  target: dev

  outputs:

    # ── Local development — PostgreSQL ──────────────────────────
    dev:
      type:     postgres
      host:     "{{ env_var('PG_HOST', 'localhost') }}"
      port:     "{{ env_var('PG_PORT', '5432') | int }}"
      dbname:   "{{ env_var('PG_DATABASE', 'kenya_food_prices') }}"
      user:     "{{ env_var('PG_USER') }}"
      password: "{{ env_var('PG_PASSWORD') }}"
      schema:   marts
      threads:  4

    # ── Production — Snowflake ──────────────────────────────────
    prod:
      type:      snowflake
      account:   "{{ env_var('SF_ACCOUNT') }}"
      user:      "{{ env_var('SF_USER') }}"
      password:  "{{ env_var('SF_PASSWORD') }}"
      role:      "{{ env_var('SF_ROLE', 'SYSADMIN') }}"
      database:  "{{ env_var('SF_DATABASE') }}"
      warehouse: "{{ env_var('SF_WAREHOUSE', 'COMPUTE_WH') }}"
      schema:    MARTS
      threads:   4
      client_session_keep_alive: False
